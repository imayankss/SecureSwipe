name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: requirements/quality.lock
      - name: Install hash-locked quality environment
        run: python -m pip install --require-hashes -r requirements/quality.lock
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q api src scripts tests
      - name: Lint
        run: python -m ruff check api src scripts tests
      - name: Type-check critical paths
        run: >-
          python -m mypy --ignore-missing-imports api src/artifacts
          src/inference src/monitoring src/evaluation/statistical_metrics.py
          src/evaluation/calibration.py src/evaluation/cost_analysis.py
          src/evaluation/temporal_validation.py src/evaluation/historical_lock.py
          src/utils/config.py src/utils/run_manifest.py
          scripts/run_development_analysis.py scripts/run_offline_monitoring.py
          scripts/create_synthetic_monitoring_demo.py scripts/run_local_load_test.py
          scripts/verify_historical_observation.py
      - name: Type-check isolated reference-stage wrapper
        run: >-
          python -m mypy --no-incremental --ignore-missing-imports
          --follow-imports=skip scripts/run_reference_stage.py
      - name: Test
        run: python -m pytest
      - name: Verify deterministic web export
        run: python scripts/export_web_data.py --check
      - name: Verify locked historical observation
        run: python scripts/verify_historical_observation.py
      - name: Verify deterministic synthetic monitoring evidence
        run: >-
          python scripts/create_synthetic_monitoring_demo.py
          --output reports/monitoring/synthetic_shift_report.json --check
      - name: Audit API dependencies
        run: >-
          python -m pip_audit -r requirements/api.lock --disable-pip
          --progress-spinner off
      - name: Build wheel
        run: python -m build --wheel
      - name: Prove clean API lock and wheel install
        run: |
          python -m venv /tmp/secureswipe-api-proof
          /tmp/secureswipe-api-proof/bin/python -m pip install --require-hashes -r requirements/api.lock
          /tmp/secureswipe-api-proof/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/secureswipe-api-proof/bin/python -c "import api.main; from src.artifacts.bundle import ModelBundle"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Test frontend static gates
        working-directory: web
        run: npm test
      - name: Install Chromium for browser gate
        working-directory: web
        run: npx playwright install --with-deps --no-shell chromium
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Test production dashboard in Chromium
        working-directory: web
        run: npm run test:e2e
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high
