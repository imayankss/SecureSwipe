name: Container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          push: false
          tags: secureswipe-api:ci-${{ matrix.suffix }}
          build-args: VCS_REF=${{ github.sha }}
      - name: Generate synthetic-only smoke bundle with candidate runtime
        env:
          IMAGE_NAME: secureswipe-api:ci-${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p artifacts
          docker run --rm --platform "$PLATFORM" \
            --user "$(id -u):$(id -g)" \
            --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/artifacts:/workspace/artifacts" \
            --workdir /workspace \
            --env PYTHONPATH=/workspace \
            "$IMAGE_NAME" \
            sh -euc '
              python scripts/create_synthetic_bundle.py --output artifacts/synthetic-ci
              find artifacts/synthetic-ci -type d -exec chmod 0755 {} +
              find artifacts/synthetic-ci -type f -exec chmod 0644 {} +
            '
      - name: Smoke liveness, readiness, and inference
        env:
          CONTAINER_NAME: secureswipe-api-ci-${{ matrix.suffix }}
          IMAGE_NAME: secureswipe-api:ci-${{ matrix.suffix }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --detach --platform "$PLATFORM" --name "$CONTAINER_NAME" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8000:8000 \
            --volume "$PWD/artifacts/synthetic-ci:/artifacts/synthetic-ci:ro" \
            --env SECURESWIPE_BUNDLE_MANIFEST=/artifacts/synthetic-ci/manifest.json \
            "$IMAGE_NAME"
          trap 'docker stop "$CONTAINER_NAME" >/dev/null; docker rm "$CONTAINER_NAME" >/dev/null' EXIT
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready >/tmp/ready.json; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health/live >/tmp/live.json
          curl --fail --silent http://127.0.0.1:8000/v1/predict \
            --header 'Content-Type: application/json' \
            --data @artifacts/synthetic-ci/smoke_request.json >/tmp/prediction.json
          python3 - <<'PY'
          import json
          import math

          expected = json.load(open("artifacts/synthetic-ci/smoke_expected.json"))
          actual = json.load(open("/tmp/prediction.json"))
          for field in ("decision", "model_version", "score_type"):
              assert actual[field] == expected[field], field
          for field in ("raw_score", "decision_score", "operating_threshold"):
              assert math.isclose(actual[field], expected[field], rel_tol=0.0, abs_tol=1e-12), field
          assert actual["calibrated_probability"] is None
          PY
          docker exec "$CONTAINER_NAME" python -c \
            "import importlib.util, os; assert os.getuid() == 10001; assert importlib.util.find_spec('pip') is None"
      - name: Scan high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secureswipe-api:ci-${{ matrix.suffix }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          version: v0.70.0
          trivyignores: .trivyignore.yaml
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: secureswipe-api:ci-${{ matrix.suffix }}
          format: spdx-json
          output-file: secureswipe-api-${{ matrix.suffix }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secureswipe-api-${{ matrix.suffix }}-sbom
          path: secureswipe-api-${{ matrix.suffix }}.spdx.json
          if-no-files-found: error
          retention-days: 14
