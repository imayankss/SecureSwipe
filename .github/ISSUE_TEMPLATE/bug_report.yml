name: Bug report
description: Report a reproducible problem in SecureSwipe.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, real transaction data, private datasets, or
        exploit details. Report security issues through SECURITY.md instead.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability or sensitive-data report.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - ML or evaluation
        - Evidence or documentation
        - Infrastructure or CI
        - Web
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction using only synthetic or public-safe inputs.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, Python, Node.js, browser, or container versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add redacted logs or screenshots if useful. Do not include secrets or real data.
