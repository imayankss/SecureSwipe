[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-fraud-risk-scoring"
version = "0.1.0"
description = "Credit Card Fraud Detection & Risk Scoring System"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Mayank Suryavanshi" }
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
