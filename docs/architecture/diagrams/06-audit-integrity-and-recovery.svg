<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" role="img" aria-labelledby="t d">
  <title id="t">Durable idempotency and transactional audit-chain integrity</title>
  <desc id="d">Durable idempotency state machine. A V2 predict request is keyed by an HMAC of the request ID plus a canonical request digest, then atomically reserved. A different digest returns 409 idempotency conflict; a completed reservation returns an exact score-free replay with the original audit receipt; a stale or failed reservation returns 503 fail closed; a new owner scores once outside the database transaction, then within a single PostgreSQL transaction locks the idempotency row and the chain head, appends a canonical audit event, stores the bounded response with its hash and receipt, advances the chain head, and commits.</desc>
  <style>
    svg {
      --surface:#fcfcfb; --surface-2:#f2f2ef; --surface-3:#e8e8e4;
      --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#78776f;
      --rule:#dcdcd6; --grid:#e6e6e0; --axis:#b4b4ac;
      --series-1:#2a78d6; --series-2:#eb6834; --invalid:#d03b3b;
      --series-1-soft:#2a78d61f;
      --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
      --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface:#1a1a19; --surface-2:#232322; --surface-3:#2d2d2b;
        --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#94938a;
        --rule:#35352f; --grid:#2b2b28; --axis:#55554e;
        --series-1:#3987e5; --series-2:#d95926; --invalid:#d03b3b;
        --series-1-soft:#3987e526;
      }
    }
    .bg   { fill: var(--surface); }
    .nb   { fill: var(--surface-2); stroke: var(--axis); }
    .nb-sealed { fill: var(--series-1-soft); stroke: var(--series-1); }
    .nb-warn   { fill: none; stroke: var(--invalid); }
    .nt   { font-family: var(--sans); font-size: 11px; fill: var(--text-primary); }
    .nt-s { font-family: var(--mono); font-size: 9.5px; fill: var(--text-muted); }
    .edge { stroke: var(--axis); fill: none; }
    .edge-cut { stroke: var(--invalid); fill: none; stroke-dasharray: 4 4; }
    .lane { fill: none; stroke: var(--rule); }
    .lanelabel { font-family: var(--mono); font-size: 9px; fill: var(--text-muted);
      letter-spacing: .09em; text-transform: uppercase; }
    .tick { font-family: var(--mono); font-size: 10px; fill: var(--text-muted); }
    .axlabel { font-family: var(--mono); font-size: 10px; fill: var(--text-secondary);
      letter-spacing: .06em; text-transform: uppercase; }
  </style>
  <rect class="bg" x="0" y="0" width="1010" height="470"/>

      <defs>
        <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <polygon points="0,1 9,5 0,9" style="fill:var(--axis)"/>
        </marker>
      </defs>

      <rect class="nb" x="410" y="8" width="170" height="30" rx="3"/>
      <text class="nt" x="495" y="28" text-anchor="middle">POST /v2/predict</text>

      <rect class="nb" x="410" y="58" width="170" height="44" rx="3"/>
      <text class="nt" x="495" y="75" text-anchor="middle">HMAC(request ID) +</text>
      <text class="nt" x="495" y="89" text-anchor="middle">canonical request digest</text>

      <rect class="nb-sealed" x="410" y="122" width="170" height="44" rx="3"/>
      <text class="nt" x="495" y="139" text-anchor="middle">Atomic reserve</text>
      <text class="nt" x="495" y="153" text-anchor="middle">INSERT … ON CONFLICT</text>

      <line class="edge" x1="495" y1="38" x2="495" y2="54" marker-end="url(#a5)"/>
      <line class="edge" x1="495" y1="102" x2="495" y2="118" marker-end="url(#a5)"/>

      <g>
        <rect class="nb-warn" x="8"   y="216" width="150" height="44" rx="3"/>
        <text class="nt" x="83"  y="233" text-anchor="middle" style="fill:var(--invalid)">409</text>
        <text class="nt" x="83"  y="247" text-anchor="middle" style="fill:var(--invalid)">idempotency_conflict</text>

        <rect class="nb" x="180" y="216" width="160" height="44" rx="3"/>
        <text class="nt" x="260" y="233" text-anchor="middle">Exact score-free replay,</text>
        <text class="nt" x="260" y="247" text-anchor="middle">original audit receipt</text>

        <rect class="nb-warn" x="362" y="216" width="150" height="44" rx="3"/>
        <text class="nt" x="437" y="240" text-anchor="middle" style="fill:var(--invalid)">503 — fail closed</text>

        <rect class="nb" x="534" y="216" width="160" height="44" rx="3"/>
        <text class="nt" x="614" y="233" text-anchor="middle">Score once, outside</text>
        <text class="nt" x="614" y="247" text-anchor="middle">the DB transaction</text>

        <path class="edge" d="M440,166 V190 H83 V212"  marker-end="url(#a5)"/>
        <path class="edge" d="M470,166 V196 H260 V212" marker-end="url(#a5)"/>
        <path class="edge" d="M520,166 V196 H437 V212" marker-end="url(#a5)"/>
        <path class="edge" d="M550,166 V190 H614 V212" marker-end="url(#a5)"/>

        <text class="nt-s" x="83"  y="206" text-anchor="middle">different digest</text>
        <text class="nt-s" x="260" y="184" text-anchor="middle">already completed</text>
        <text class="nt-s" x="437" y="206" text-anchor="middle">reserved / stale / failed</text>
        <text class="nt-s" x="614" y="206" text-anchor="middle">new owner</text>
      </g>

      <rect class="lane" x="524" y="292" width="478" height="102" rx="3" stroke-dasharray="4 4"/>
      <text class="lanelabel" x="534" y="308">single PostgreSQL transaction — all of it, or none of it</text>
      <g>
        <rect class="nb" x="534" y="322" width="106" height="56" rx="3"/>
        <text class="nt" x="587" y="346" text-anchor="middle">Lock idempotency</text>
        <text class="nt" x="587" y="360" text-anchor="middle">row, then chain head</text>

        <rect class="nb" x="654" y="322" width="106" height="56" rx="3"/>
        <text class="nt" x="707" y="346" text-anchor="middle">Append canonical</text>
        <text class="nt" x="707" y="360" text-anchor="middle">audit event</text>

        <rect class="nb" x="774" y="322" width="106" height="56" rx="3"/>
        <text class="nt" x="827" y="339" text-anchor="middle">Store response</text>
        <text class="nt" x="827" y="353" text-anchor="middle">+ hash</text>
        <text class="nt" x="827" y="367" text-anchor="middle">+ receipt</text>

        <rect class="nb" x="894" y="322" width="96" height="56" rx="3"/>
        <text class="nt" x="942" y="346" text-anchor="middle">Advance</text>
        <text class="nt" x="942" y="360" text-anchor="middle">chain head</text>

        <line class="edge" x1="640" y1="350" x2="650" y2="350" marker-end="url(#a5)"/>
        <line class="edge" x1="760" y1="350" x2="770" y2="350" marker-end="url(#a5)"/>
        <line class="edge" x1="880" y1="350" x2="890" y2="350" marker-end="url(#a5)"/>
      </g>
      <path class="edge" d="M614,260 V280 H587 V318" marker-end="url(#a5)"/>
      <text class="nt-s" x="622" y="276">completion admission</text>

      <rect class="nb-sealed" x="700" y="418" width="230" height="36" rx="3"/>
      <text class="nt" x="815" y="441" text-anchor="middle">Commit → bounded decision + original receipt</text>
      <path class="edge" d="M942,378 V400 H815 V414" marker-end="url(#a5)"/>

      <path class="edge" d="M260,260 V420 H696" marker-end="url(#a5)" stroke-dasharray="4 4"/>
      <text class="nt-s" x="272" y="414">a replay reaches the same response without scoring or appending again</text>
    </svg>
